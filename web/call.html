<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatVani — Voice Call</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050a18;
            --card: #0d1529;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.25);
            --saffron: #ff9933;
            --green: #138808;
            --red: #ef4444;
            --text: #f1f5f9;
            --muted: #64748b;
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background glow */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow.saffron {
            background: var(--saffron);
            top: -100px;
            left: -100px;
        }

        .bg-glow.green {
            background: var(--green);
            bottom: -100px;
            right: -100px;
        }

        /* Main container */
        .call-screen {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 40px 24px;
        }

        /* Avatar */
        .avatar-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--saffron), var(--accent), var(--green), var(--saffron));
            animation: spin 4s linear infinite;
            opacity: 0.5;
        }

        .avatar-ring.active::before {
            opacity: 1;
        }

        .avatar-ring.listening::before {
            animation: spin 1s linear infinite, pulse-ring 1.5s ease-in-out infinite;
            opacity: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-ring {

            0%,
            100% {
                inset: -4px;
                opacity: 1;
            }

            50% {
                inset: -12px;
                opacity: 0.6;
            }
        }

        .avatar-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a2235, #0d1529);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            position: relative;
            z-index: 1;
        }

        .caller-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--saffron), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .caller-sub {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .call-status {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 32px;
            min-height: 20px;
        }

        .call-timer {
            font-size: 16px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 24px;
            font-variant-numeric: tabular-nums;
        }

        /* Live transcript */
        .transcript-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 32px;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .transcript-line {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .transcript-line.user {
            color: var(--accent);
        }

        .transcript-line.user::before {
            content: '🎤 You: ';
            font-weight: 600;
        }

        .transcript-line.ai {
            color: #94a3b8;
        }

        .transcript-line.ai::before {
            content: '🇮🇳 BharatVani: ';
            font-weight: 600;
        }

        .transcript-line.system {
            color: var(--muted);
            font-style: italic;
            font-size: 12px;
        }

        /* Sound wave */
        .sound-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 40px;
            margin-bottom: 32px;
        }

        .sound-wave .bar {
            width: 4px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.15s ease;
            height: 8px;
        }

        .sound-wave.active .bar {
            animation: wave 0.8s ease-in-out infinite;
        }

        .sound-wave.active .bar:nth-child(1) {
            animation-delay: 0s;
        }

        .sound-wave.active .bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .sound-wave.active .bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .sound-wave.active .bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        .sound-wave.active .bar:nth-child(5) {
            animation-delay: 0.15s;
        }

        .sound-wave.active .bar:nth-child(6) {
            animation-delay: 0.25s;
        }

        .sound-wave.active .bar:nth-child(7) {
            animation-delay: 0.05s;
        }

        @keyframes wave {

            0%,
            100% {
                height: 8px;
            }

            50% {
                height: 32px;
            }
        }

        /* Buttons */
        .call-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .call-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.2s;
            position: relative;
        }

        .call-btn:hover {
            transform: scale(1.08);
        }

        .call-btn:active {
            transform: scale(0.95);
        }

        .btn-call {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
            color: white;
        }

        .btn-end {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            color: white;
        }

        .btn-mic {
            background: linear-gradient(135deg, var(--accent), #ea580c);
            box-shadow: 0 4px 20px var(--accent-glow);
            color: white;
        }

        .btn-mic.recording {
            animation: mic-pulse 1.5s ease-in-out infinite;
        }

        @keyframes mic-pulse {

            0%,
            100% {
                box-shadow: 0 4px 20px var(--accent-glow);
            }

            50% {
                box-shadow: 0 4px 40px rgba(249, 115, 22, 0.6);
            }
        }

        .btn-small {
            width: 56px;
            height: 56px;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .hidden {
            display: none !important;
        }

        /* Idle screen */
        .idle-text {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Language indicator */
        .lang-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="bg-glow saffron"></div>
    <div class="bg-glow green"></div>

    <div class="call-screen">
        <!-- Avatar -->
        <div class="avatar-ring" id="avatarRing">
            <div class="avatar-inner">🇮🇳</div>
        </div>

        <div class="caller-name">BharatVani</div>
        <div class="caller-sub">भारत वाणी — AI Voice Assistant</div>
        <div class="lang-badge">🎙️ Hindi Voice Call</div>
        <div class="call-status" id="callStatus">Tap the green button to start</div>
        <div class="call-timer hidden" id="callTimer">00:00</div>

        <!-- Sound wave -->
        <div class="sound-wave" id="soundWave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Live transcript -->
        <div class="transcript-box hidden" id="transcriptBox">
            <div id="transcriptContent"></div>
        </div>

        <!-- Buttons: Idle -->
        <div class="call-buttons" id="idleButtons">
            <button class="call-btn btn-call" onclick="startCall()" title="Start Call">📞</button>
        </div>

        <!-- Buttons: In-call -->
        <div class="call-buttons hidden" id="callButtons">
            <button class="call-btn btn-end" onclick="endCall()" title="End Call">📵</button>
            <button class="call-btn btn-mic" id="micBtn" onclick="toggleMic()" title="Hold to speak">🎤</button>
            <button class="call-btn btn-small" onclick="replayLast()" title="Replay last response">🔁</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://p37tglqhc0.execute-api.ap-south-1.amazonaws.com/chat';
        let sessionId = null;
        let isInCall = false;
        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let synth = window.speechSynthesis;
        let lastAiResponse = '';
        let timerInterval = null;
        let callSeconds = 0;

        const avatarRing = document.getElementById('avatarRing');
        const callStatus = document.getElementById('callStatus');
        const callTimer = document.getElementById('callTimer');
        const soundWave = document.getElementById('soundWave');
        const transcriptBox = document.getElementById('transcriptBox');
        const transcriptContent = document.getElementById('transcriptContent');
        const idleButtons = document.getElementById('idleButtons');
        const callButtons = document.getElementById('callButtons');
        const micBtn = document.getElementById('micBtn');

        // ===== Speech Recognition Setup =====
        function setupRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Your browser does not support speech recognition. Please use Chrome.');
                return null;
            }

            const r = new SpeechRecognition();
            r.lang = 'hi-IN';
            r.interimResults = true;
            r.continuous = true;
            r.maxAlternatives = 1;

            r.onresult = (event) => {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                if (interim) {
                    callStatus.textContent = '🎤 ' + interim + '...';
                }

                if (final && final.trim()) {
                    stopListening();
                    processVoiceInput(final.trim());
                }
            };

            r.onerror = (event) => {
                console.warn('Speech error:', event.error);
                if (event.error === 'no-speech') {
                    callStatus.textContent = 'Kuch sunai nahi diya... fir se boliye';
                    setTimeout(() => { if (isInCall && !isSpeaking) startListening(); }, 2000);
                }
            };

            r.onend = () => {
                if (isListening) {
                    // Restart if still supposed to be listening
                    try { r.start(); } catch (e) { }
                }
            };

            return r;
        }

        // ===== Call Flow =====
        async function startCall() {
            isInCall = true;
            sessionId = null;

            idleButtons.classList.add('hidden');
            callButtons.classList.remove('hidden');
            transcriptBox.classList.remove('hidden');
            callTimer.classList.remove('hidden');
            avatarRing.classList.add('active');

            callStatus.textContent = 'Connecting...';
            transcriptContent.innerHTML = '';

            // Start timer
            callSeconds = 0;
            timerInterval = setInterval(() => {
                callSeconds++;
                const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const s = String(callSeconds % 60).padStart(2, '0');
                callTimer.textContent = m + ':' + s;
            }, 1000);

            recognition = setupRecognition();

            // Greet
            addTranscript('system', 'Call connected...');
            await speakText('Namaste! BharatVani mein aapka swagat hai. Mujhse kuch bhi poochiye, main sun rahi hoon.');
        }

        function endCall() {
            isInCall = false;
            isListening = false;
            isSpeaking = false;

            if (recognition) { try { recognition.stop(); } catch (e) { } recognition = null; }
            synth.cancel();
            clearInterval(timerInterval);

            idleButtons.classList.remove('hidden');
            callButtons.classList.add('hidden');
            callTimer.classList.add('hidden');
            avatarRing.classList.remove('active', 'listening');
            soundWave.classList.remove('active');

            callStatus.textContent = 'Call ended • Tap green to call again';
            addTranscript('system', `Call ended — ${callTimer.textContent}`);
        }

        function toggleMic() {
            if (isListening) {
                stopListening();
            } else {
                if (isSpeaking) { synth.cancel(); isSpeaking = false; }
                startListening();
            }
        }

        function startListening() {
            if (!recognition || !isInCall) return;
            isListening = true;
            micBtn.classList.add('recording');
            avatarRing.classList.add('listening');
            soundWave.classList.add('active');
            callStatus.textContent = '🎤 Bol rahe hain... sun rahi hoon';

            try { recognition.start(); } catch (e) { }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('recording');
            avatarRing.classList.remove('listening');
            soundWave.classList.remove('active');

            if (recognition) { try { recognition.stop(); } catch (e) { } }
        }

        // ===== Process Voice Input =====
        async function processVoiceInput(text) {
            addTranscript('user', text);
            callStatus.textContent = '💭 Soch rahi hoon...';
            soundWave.classList.add('active');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId })
                });

                const data = await response.json();
                if (data.sessionId) sessionId = data.sessionId;

                const aiText = data.response || 'Maaf kijiye, samajh nahi aaya.';
                lastAiResponse = aiText;
                addTranscript('ai', aiText);

                await speakText(aiText);

            } catch (err) {
                console.error('API error:', err);
                const errText = 'Maaf kijiye, network problem hai. Dobara try karein.';
                addTranscript('ai', errText);
                await speakText(errText);
            }
        }

        // ===== Text to Speech =====
        function speakText(text) {
            return new Promise((resolve) => {
                isSpeaking = true;
                soundWave.classList.add('active');
                callStatus.textContent = '🔊 Bol rahi hoon...';

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.95;
                utterance.pitch = 1.1;

                // Try to find Hindi voice
                const voices = synth.getVoices();
                const hindiVoice = voices.find(v => v.lang.includes('hi')) || voices.find(v => v.lang.includes('in'));
                if (hindiVoice) utterance.voice = hindiVoice;

                utterance.onend = () => {
                    isSpeaking = false;
                    soundWave.classList.remove('active');
                    if (isInCall) {
                        // Auto-listen again — like a real phone call
                        callStatus.textContent = '🎤 Sun rahi hoon... boliye';
                        setTimeout(() => { if (isInCall) startListening(); }, 500);
                    }
                    resolve();
                };

                utterance.onerror = () => {
                    isSpeaking = false;
                    soundWave.classList.remove('active');
                    resolve();
                };

                synth.speak(utterance);
            });
        }

        function replayLast() {
            if (lastAiResponse && !isSpeaking) {
                speakText(lastAiResponse);
            }
        }

        // ===== Transcript =====
        function addTranscript(type, text) {
            const div = document.createElement('div');
            div.className = `transcript-line ${type}`;
            div.textContent = text;
            transcriptContent.appendChild(div);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        // Load voices
        synth.onvoiceschanged = () => synth.getVoices();
    </script>
</body>

</html>
