AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BharatVani - Voice-First Digital Access Platform for India
  Production-grade: Provisioned Concurrency, X-Ray Tracing, DynamoDB
  Cache, API Gateway Throttling, CloudWatch Alarms, SQS DLQ

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - '*'
      AllowHeaders:
        - Content-Type
      AllowMethods:
        - POST
        - GET
        - OPTIONS
    # API Gateway throttling — protects Bedrock quota from abuse/spikes
    DefaultRouteSettings:
      ThrottlingBurstLimit: 200    # handles sudden traffic spikes
      ThrottlingRateLimit: 100     # sustained 100 req/sec max
  Function:
    Timeout: 60
    Runtime: nodejs18.x
    MemorySize: 512
    Tracing: Active               # AWS X-Ray tracing on all functions
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockModelId:
    Type: String
    Default: apac.anthropic.claude-3-5-haiku-20241022-v1:0
  WeatherApiKey:
    Type: String
    Default: ''
    Description: OpenWeatherMap API key
  NewsApiKey:
    Type: String
    Default: ''
    Description: NewsAPI key (unused — NDTV RSS is free)
  TavilyApiKey:
    Type: String
    Default: ''
    Description: Tavily AI search key

Resources:

  # ========================================
  # DynamoDB Tables
  # ========================================

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'BharatVani-Sessions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: BharatVani

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'BharatVani-Users-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: phone_number
          KeyType: HASH
      Tags:
        - Key: Project
          Value: BharatVani

  QueryLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'BharatVani-QueryLogs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: query_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: query_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: BharatVani

  # Cache table — stores weather/news/Tavily responses with TTL auto-expiry
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'BharatVani-Cache-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: BharatVani

  # ========================================
  # S3 Bucket for Knowledge Base
  # ========================================

  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'bharatvani-kb-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: BharatVani

  # ========================================
  # SQS Dead Letter Queue
  # ========================================

  OrchestratorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'BharatVani-DLQ-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days max retention
      Tags:
        - Key: Project
          Value: BharatVani

  # ========================================
  # Lambda Function — The Orchestrator
  # ========================================

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'BharatVani-Orchestrator-${Environment}'
      CodeUri: ../lambda/orchestrator/
      Handler: index.handler
      Description: BharatVani main orchestrator — handles full voice AI pipeline
      # -------------------------------------------------------
      # PRODUCTION SCALING (requires AWS quota increase first):
      # Request concurrency increase: aws support create-case
      # Then uncomment these lines:
      # AutoPublishAlias: live
      # ProvisionedConcurrencyConfig:
      #   ProvisionedConcurrentExecutions: 3   # warm instances, no cold starts
      # ReservedConcurrentExecutions: 80       # ~80% of total account concurrency
      # -------------------------------------------------------
      Tracing: Active
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt OrchestratorDLQ.Arn
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          USERS_TABLE: !Ref UsersTable
          QUERY_LOGS_TABLE: !Ref QueryLogsTable
          CACHE_TABLE: !Ref CacheTable
          KB_BUCKET: !Ref KnowledgeBucket
          AUDIO_BUCKET: !Ref KnowledgeBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ENVIRONMENT: !Ref Environment
          WEATHER_API_KEY: !Ref WeatherApiKey
          NEWS_API_KEY: !Ref NewsApiKey
          TAVILY_API_KEY: !Ref TavilyApiKey
      Events:
        VoiceIncoming:
          Type: HttpApi
          Properties:
            Path: /voice/incoming
            Method: POST
        VoiceLanguage:
          Type: HttpApi
          Properties:
            Path: /voice/language
            Method: POST
        VoiceGather:
          Type: HttpApi
          Properties:
            Path: /voice/gather
            Method: POST
        VoiceHealthCheck:
          Type: HttpApi
          Properties:
            Path: /voice/health
            Method: GET
        WebChat:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
      Policies:
        # DynamoDB — sessions, users, logs, cache
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QueryLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        # S3 — knowledge base
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
        # Bedrock — invoke Claude models
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                - 'arn:aws:bedrock:*::foundation-model/*'
        # SNS — OTP and confirmation SMS
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: '*'
        # Polly — TTS synthesis
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
        # SQS — write to DLQ on failure
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt OrchestratorDLQ.Arn
        # X-Ray — distributed tracing
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: '*'
      Tags:
        Project: BharatVani

  # Lambda permission for Amazon Connect (for future Connect integration)
  ConnectLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: connect.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ========================================
  # CloudWatch Alarms
  # ========================================

  # Alarm 1: Error count > 10 in 5 minutes
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'BharatVani-LambdaErrors-${Environment}'
      AlarmDescription: 'Lambda error count exceeds 10 in 5 minutes — investigate immediately'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrchestratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: BharatVani

  # Alarm 2: Any Lambda throttles (reserved concurrency protecting backend)
  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'BharatVani-LambdaThrottles-${Environment}'
      AlarmDescription: 'Lambda throttling detected — consider raising ReservedConcurrentExecutions'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrchestratorFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: BharatVani

  # Alarm 3: P95 duration > 10s (voice calls need response in < 8s ideally)
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'BharatVani-LambdaDuration-${Environment}'
      AlarmDescription: 'Lambda P95 latency exceeds 10s — degraded voice call experience'
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrchestratorFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Project
          Value: BharatVani

Outputs:
  ApiEndpoint:
    Description: API Gateway URL (use this as Twilio webhook base)
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  TwilioWebhookUrl:
    Description: Set this as your Twilio Voice webhook URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/voice/incoming'

  OrchestratorFunctionArn:
    Description: Orchestrator Lambda ARN (use this in Connect)
    Value: !GetAtt OrchestratorFunction.Arn

  SessionsTableName:
    Description: DynamoDB Sessions table name
    Value: !Ref SessionsTable

  CacheTableName:
    Description: DynamoDB Cache table name (weather/news/Tavily with TTL)
    Value: !Ref CacheTable

  DLQUrl:
    Description: SQS Dead Letter Queue URL for failed invocations
    Value: !Ref OrchestratorDLQ

  KnowledgeBucketName:
    Description: S3 Knowledge Base bucket
    Value: !Ref KnowledgeBucket

  DeploymentRegion:
    Description: AWS Region
    Value: !Ref AWS::Region
